name: Release

on:
  push:
    tags:
      - 'v*'        # Triggers on v1.0.0, v1.2.3, etc.

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write    # Needed to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          xcodebuild -project EdgePad.xcodeproj \
            -scheme EdgePad \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Locate .app
        id: app
        run: |
          APP_PATH=$(find build -name "EdgePad.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          # Create a temporary folder for DMG contents
          mkdir -p dmg-content
          cp -R "${{ steps.app.outputs.APP_PATH }}" dmg-content/

          # Create a symlink to /Applications for drag-and-drop install
          ln -s /Applications dmg-content/Applications

          # Build the DMG
          hdiutil create -volname "EdgePad" \
            -srcfolder dmg-content \
            -ov -format UDZO \
            "EdgePad-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 "EdgePad-${{ steps.version.outputs.VERSION }}.dmg" | awk '{print $1}')
          echo "SHA256=$SHA" >> "$GITHUB_OUTPUT"
          echo "### DMG SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "EdgePad-${{ steps.version.outputs.VERSION }}.dmg"
          generate_release_notes: true
          body: |
            ## Install via Homebrew
            ```bash
            brew install --cask X377AAHIL/edgepad/edgepad
            ```

            ## Manual Install
            Download `EdgePad-${{ steps.version.outputs.VERSION }}.dmg` below, then:
            ```bash
            xattr -cr /Applications/EdgePad.app
            ```

            **SHA256:** `${{ steps.sha.outputs.SHA256 }}`

      - name: Update Homebrew Cask
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: X377AAHIL/homebrew-edgepad
          event-type: update-cask
          client-payload: |
            {
              "version": "${{ steps.version.outputs.VERSION }}",
              "sha256": "${{ steps.sha.outputs.SHA256 }}"
            }
