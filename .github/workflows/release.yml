name: Release

on:
  push:
    tags:
      - 'v*'        # Triggers on v1.0.0, v1.2.3, etc.

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write    # Needed to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          xcodebuild -project EdgePad.xcodeproj \
            -scheme EdgePad \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO

      - name: Locate .app
        id: app
        run: |
          APP_PATH=$(find build -name "EdgePad.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create ZIP
        run: |
          cd "$(dirname "${{ steps.app.outputs.APP_PATH }}")"
          zip -r -y "$GITHUB_WORKSPACE/EdgePad-${{ steps.version.outputs.VERSION }}.zip" EdgePad.app

      - name: Create DMG
        run: |
          mkdir -p dmg-content
          cp -R "${{ steps.app.outputs.APP_PATH }}" dmg-content/

          hdiutil create -volname "EdgePad" \
            -srcfolder dmg-content \
            -ov -format UDZO \
            "EdgePad-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Compute checksums
        id: sha
        run: |
          ZIP_SHA=$(shasum -a 256 "EdgePad-${{ steps.version.outputs.VERSION }}.zip" | awk '{print $1}')
          DMG_SHA=$(shasum -a 256 "EdgePad-${{ steps.version.outputs.VERSION }}.dmg" | awk '{print $1}')
          echo "ZIP_SHA256=$ZIP_SHA" >> "$GITHUB_OUTPUT"
          echo "DMG_SHA256=$DMG_SHA" >> "$GITHUB_OUTPUT"
          echo "### Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ZIP: $ZIP_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "DMG: $DMG_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EdgePad-${{ steps.version.outputs.VERSION }}.zip
            EdgePad-${{ steps.version.outputs.VERSION }}.dmg
          generate_release_notes: true
          body: |
            ## Install via Homebrew (Recommended)
            ```bash
            brew install --cask X377AAHIL/edgepad/edgepad
            ```

            ## Direct Download
            Download `EdgePad-${{ steps.version.outputs.VERSION }}.dmg` below.

            | File | SHA256 |
            |------|--------|
            | ZIP | `${{ steps.sha.outputs.ZIP_SHA256 }}` |
            | DMG | `${{ steps.sha.outputs.DMG_SHA256 }}` |

      - name: Update Homebrew Cask
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: X377AAHIL/homebrew-edgepad
          event-type: update-cask
          client-payload: |
            {
              "version": "${{ steps.version.outputs.VERSION }}",
              "sha256": "${{ steps.sha.outputs.ZIP_SHA256 }}"
            }

